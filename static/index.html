<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respiri al minuto</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d232b; --muted:#6b7480; --accent:#2a7de1; --peak:#e1532a; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --card:#1d2127; --fg:#e8ebef; --muted:#97a0ab; --accent:#5ba2ff; --peak:#ff7b52; --line:#2c323a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .hero { text-align:center; }
  #bpm { font-size: clamp(72px, 22vw, 160px); font-weight:700; line-height:1; font-variant-numeric: tabular-nums; }
  .unit { color:var(--muted); font-size:20px; margin-top:4px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:16px; color:var(--muted); font-size:14px; }
  .row b { color:var(--fg); font-weight:600; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#999; margin-right:6px; vertical-align:middle; }
  .dot.ok { background:#2fb36b; } .dot.warn { background:#e0a326; } .dot.off { background:#d9534f; }
  h2 { font-size:14px; font-weight:600; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  canvas { width:100%; height:160px; display:block; }
  .meter { position:relative; height:22px; border-radius:6px; background:var(--line); overflow:hidden; margin:6px 0 4px; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--accent); opacity:.55; transition:width .4s; }
  .meter .noise { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--muted); opacity:.45; transition:width .4s; }
  .meter .mark { position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; display:none; transition:left .4s; }
  .meter .mark.noise-mark { background:var(--fg); }
  .meter .mark.breath-mark { background:var(--peak); }
  .scale { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:14px; color:var(--muted); }
  .legend b { color:var(--fg); font-weight:600; font-variant-numeric: tabular-nums; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #noise-msg { margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<main>
  <section class="card hero">
    <div id="bpm">--</div>
    <div class="unit">respiri al minuto</div>
    <div class="row">
      <span><span id="dot" class="dot"></span><b id="status">connessione...</b></span>
      <span>Qualità: <b id="quality">-</b></span>
      <span>Livello: <b id="level">-</b></span>
      <span>Sorgente: <b id="source">-</b></span>
    </div>
  </section>
  <section class="card">
    <h2>Rumore di fondo</h2>
    <div class="meter" title="Livello del microfono in dB (0 = massimo)">
      <div class="fill" id="m-level"></div>
      <div class="noise" id="m-noise"></div>
      <div class="mark noise-mark" id="m-noise-mark"></div>
      <div class="mark breath-mark" id="m-breath-mark"></div>
    </div>
    <div class="scale"><span>-90 dB</span><span>-60</span><span>-30</span><span>0 dB</span></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--muted)"></span>Rumore di fondo: <b id="noise">-</b></span>
      <span><span class="sw" style="background:var(--peak)"></span>Livello respiro: <b id="breath">-</b></span>
      <span><span class="sw" style="background:var(--accent)"></span>Livello attuale: <b id="level2">-</b></span>
      <span>Margine respiro/rumore: <b id="snr">-</b></span>
    </div>
    <div id="noise-msg"><span id="noise-dot" class="dot"></span><span id="noise-text">in attesa di dati...</span></div>
  </section>
  <section class="card">
    <h2>Suono del respiro (ultimi secondi)</h2>
    <canvas id="env" height="160"></canvas>
  </section>
  <section class="card">
    <h2>Andamento BPM</h2>
    <canvas id="trend" height="160"></canvas>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const history = []; // [t, bpm]
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function setupCanvas(c) {
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight || 160;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return [ctx, w, h];
}

function drawEnvelope(d) {
  const [ctx, w, h] = setupCanvas($('env'));
  const e = d.envelope || [];
  if (e.length < 2) return;
  const min = Math.min(...e), max = Math.max(...e), span = (max - min) || 1;
  const x = i => i / (e.length - 1) * w;
  const y = v => h - 8 - (v - min) / span * (h - 16);
  ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1.5; ctx.beginPath();
  e.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.stroke();
  ctx.fillStyle = css('--peak');
  for (const pt of d.peaks || []) {
    const i = Math.round((pt - d.start_t) / d.env_dt);
    if (i < 0 || i >= e.length) continue;
    ctx.beginPath(); ctx.arc(x(i), y(e[i]), 4, 0, 2 * Math.PI); ctx.fill();
  }
}

function drawTrend() {
  const [ctx, w, h] = setupCanvas($('trend'));
  const pts = history.filter(p => p[1] != null);
  ctx.fillStyle = css('--muted'); ctx.font = '12px sans-serif';
  if (pts.length < 2) { ctx.fillText('in attesa di dati...', 8, 20); return; }
  const t0 = history[0][0], t1 = history[history.length - 1][0];
  const vals = pts.map(p => p[1]);
  const lo = Math.max(0, Math.floor(Math.min(...vals) - 3)), hi = Math.ceil(Math.max(...vals) + 3);
  const x = t => 36 + (t - t0) / ((t1 - t0) || 1) * (w - 44);
  const y = v => h - 8 - (v - lo) / ((hi - lo) || 1) * (h - 16);
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
  for (const v of [lo, (lo + hi) / 2, hi]) {
    ctx.beginPath(); ctx.moveTo(36, y(v)); ctx.lineTo(w, y(v)); ctx.stroke();
    ctx.fillText(v.toFixed(0), 4, y(v) + 4);
  }
  ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2; ctx.beginPath();
  let pen = false;
  for (const [t, v] of history) {
    if (v == null) { pen = false; continue; }
    pen ? ctx.lineTo(x(t), y(v)) : ctx.moveTo(x(t), y(v)); pen = true;
  }
  ctx.stroke();
}

const DB_MIN = -90, DB_MAX = 0;
const pct = v => Math.max(0, Math.min(100, (v - DB_MIN) / (DB_MAX - DB_MIN) * 100)) + '%';
const fmtDb = v => v == null ? '-' : v.toFixed(0) + ' dB';

function updateNoise(d) {
  const has = v => v != null && isFinite(v);
  $('m-level').style.width = has(d.level) && d.level ? pct(d.level) : '0';
  $('m-noise').style.width = has(d.noise_floor) ? pct(d.noise_floor) : '0';
  for (const [id, v] of [['m-noise-mark', d.noise_floor], ['m-breath-mark', d.breath_level]]) {
    $(id).style.display = has(v) ? 'block' : 'none';
    if (has(v)) $(id).style.left = pct(v);
  }
  $('noise').textContent = fmtDb(d.noise_floor);
  $('breath').textContent = fmtDb(d.breath_level);
  $('level2').textContent = d.level ? fmtDb(d.level) : '-';
  $('snr').textContent = has(d.snr) ? d.snr.toFixed(0) + ' dB' : '-';
  const msg = {
    basso: ['ok', 'Rumore basso: il respiro si distingue bene dal fondo'],
    medio: ['warn', 'Rumore medio: rilevazione possibile ma meno affidabile'],
    alto:  ['off', 'Rumore alto: il respiro si confonde con il fondo, avvicina il microfono o riduci i rumori'],
  }[d.noise_status];
  const [cls, text] = msg || (has(d.noise_floor)
    ? ['warn', 'Rumore di fondo misurato, nessun respiro distinguibile dal fondo']
    : ['', 'in attesa di dati...']);
  $('noise-dot').className = 'dot ' + cls;
  $('noise-text').textContent = text;
}

function update(d) {
  updateNoise(d);
  $('bpm').textContent = d.bpm != null ? Math.round(d.bpm) : '--';
  $('status').textContent = d.status;
  $('quality').textContent = d.bpm != null ? Math.round(d.quality * 100) + '%' : '-';
  $('level').textContent = d.level ? d.level.toFixed(0) + ' dB' : '-';
  $('source').textContent = d.source || '-';
  $('dot').className = 'dot ' + (d.bpm == null ? 'off' : d.quality > 0.6 ? 'ok' : 'warn');
  document.title = (d.bpm != null ? Math.round(d.bpm) + ' BPM · ' : '') + 'Respiri al minuto';
  history.push([d.t, d.bpm]);
  while (history.length > 600) history.shift(); // ~10 minuti
  drawEnvelope(d); drawTrend();
}

function connect() {
  const es = new EventSource('/events');
  es.onmessage = ev => update(JSON.parse(ev.data));
  es.onerror = () => {
    $('status').textContent = 'disconnesso, riprovo...';
    $('dot').className = 'dot off';
  };
}
connect();
</script>
</body>
</html>
